[Journal]
Storage=volatile
SystemMaxUse=64M
SystemMaxFileSize=8M
SystemKeepFree=1G
RuntimeMaxUse=16M
RuntimeMaxFileSize=2M
RuntimeKeepFree=64M
MaxRetentionSec=7day
MaxFileSec=1day
RateLimitIntervalSec=0
RateLimitBurst=1000
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
ForwardToWall=no
Compress=no
